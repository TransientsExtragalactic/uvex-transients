# ============================================================================ #
# uvex_transients CLI: complete-population run                                 #
# ============================================================================ #
# A full-scale, every-registered-transient-class run-config for the
# `uvex-transients` CLI. Where `configs/quickstart_tde.yaml` is a small,
# fast, single-class demo, this config is meant to produce genuinely
# representative UVEX yields across every transient population the package
# ships (see `uvex_transients.transients.base.TransientBase.registry()`):
# kilonovae, tidal disruption events, luminous fast blue optical transients,
# Type II supernovae (both Type IIP variants and Type IIb), Type Ib, Ic and
# Ic-BL supernovae, Type I superluminous supernovae, and Type Ia supernovae.
# `ShockCoolingIIb` is deliberately left out: it is a bespoke, first-principles
# model of just the early shock-cooling phase of the Type IIb population
# `TypeIIbSNe` already covers.
#
# It's wired up as `make run` (see the Makefile), which writes its output
# under `results/full_run/`. Run it directly instead with:
#
#     uvex-transients run configs/full_run.yaml --out-dir results/full_run/
#
# Full-scale sampling is not cheap: expect this to take substantially longer
# than the quickstart config, since `generate:` below neither shrinks
# `nside`/`time_bins` below the package default nor downsamples any
# population beyond what its own event rate needs to stay tractable.

schedule:
  name: uvex_dev

mission: uvex_fast

# One entry per registered `TransientBase` subclass. Each uses its own
# defaults (rate, redshift limit, duration window; see
# `uvex_transients/transients/*.py`) unmodified.
transients:
  kilonova:
    class: Kilonova
  tde:
    class: TidalDisruptionEvent
  lfbot:
    class: LuminousFastBlueOpticalTransient
  iip_sne:
    class: TypeIIPSNe
  iip_excess_sne:
    class: TypeIIPExcessSNe
  iib_sne:
    class: TypeIIbSNe
  ib_sne:
    class: TypeIbSNe
  ic_sne:
    class: TypeIcSNe
  icbl_sne:
    class: TypeIcBLSNe
  slsne:
    class: MagnetarSLSNe
  ia_sne:
    class: TypeIaSNe

# `nside`/`order` are left unset (package default: `healpix.default_nside`/
# `healpix.default_order` in `uvex_transients/config.yaml`). `time_bins` is
# generous enough to resolve the full mission window at that resolution.
# `downsample` here is a single factor applied uniformly across every
# registered type -- 20 keeps the highest-rate populations (TDEs, Type IIP
# SNe) tractable; counts for every type are rescaled back up by this factor
# automatically once sampled. It can instead be a `{transient key: factor}`
# mapping (see `docs/source/user_guide/cli/overview.rst`) to downsample types
# individually, e.g. leaving the rarer kilonova/LFBOT populations untouched
# while still downsampling TDEs/SNe.
generate:
  time_bins: 200
  downsample: 20
  seed: 42

# Two `cut` steps, chained, then a `photometry` action over whatever survives
# both, then a `yield` summary and a `detection_counts` action (see
# `PhotometryCatalog.compute_detection_count_table`): per transient type, the
# expected number of UVEX events detected in >= k SNR-qualifying epochs.
# `snr_threshold` matches `snr_screen` above so this table's k=1 row
# reproduces `yield`'s own `detected_events`/`expected_detections`.
# `detection_counts` takes the full, pre-cut `baseline` catalog (like `yield`'s
# `raw:`), NOT `snr_screen`: its `n_total` is the efficiency's denominator, so
# a post-cut catalog would inflate every `expected_events` by ~1/efficiency. `yield`'s
# and `detection_counts`' explicit `checkpoint:` filenames
# (`yield_summary.ecsv`/`detection_counts.ecsv`) are load-bearing: they feed
# the website's automated report page (see `docs/source/_report_gen.py`),
# which reads them by exact name from this run's published release assets
# (see `.github/workflows/build_and_release.yml`) -- renaming either breaks
# that page.
steps:
  - id: mag_screen
    type: cut
    cut: limiting_magnitude
    input: baseline
    params:
      mag_limit: 25.0

  - id: snr_screen
    type: cut
    cut: snr
    input: mag_screen
    params:
      snr_threshold: 5.0
      exclude_first_visit_detections: true
    checkpoint: final_catalog.ecsv

  - id: phot
    type: action
    action: photometry
    inputs:
      catalog: snr_screen
    params:
      bands: [FUV, NUV]
    # Full-scale event counts make the intermediate cut catalogs large and
    # rarely worth keeping around (see `keep_intermediate:` below) -- but the
    # photometry table itself is always worth writing, so it opts back in.
    checkpoint: photometry.ecsv

  - id: yield_summary
    type: action
    action: yield
    inputs:
      raw: baseline
      detected: snr_screen
      exposure: exposure
    checkpoint: yield_summary.ecsv

  - id: detection_counts
    type: action
    action: detection_counts
    inputs:
      catalog: baseline
      exposure: exposure
      photometry: phot
    params:
      snr_threshold: 5.0
    checkpoint: detection_counts.ecsv

# Suppresses per-step checkpointing by default (every step above whose own
# `checkpoint:` is unset), and the raw generated `baseline.ecsv` along with
# it -- only `phot`/`yield_summary`/`detection_counts`, which opt back in
# explicitly, and the always-written `exposure.ecsv`, are written to
# `--out-dir`.
keep_intermediate: false

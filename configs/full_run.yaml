# ============================================================================ #
# uvex_transients CLI: complete-population run                                 #
# ============================================================================ #
# A full-scale, every-registered-transient-class run-config for the
# `uvex-transients` CLI. Where `configs/quickstart_tde.yaml` is a small,
# fast, single-class demo, this config is meant to produce genuinely
# representative UVEX yields across every transient population the package
# ships (see `uvex_transients.transients.base.TransientBase.registry()`):
# kilonovae, tidal disruption events, luminous fast blue optical transients,
# Type II supernovae (both Type IIP variants and Type IIb), Type Ib, Ic and
# Ic-BL supernovae, Type I superluminous supernovae, and Type Ia supernovae.
# `ShockCoolingIIb` is deliberately left out: it is a bespoke, first-principles
# model of just the early shock-cooling phase of the Type IIb population
# `TypeIIbSNe` already covers.
#
# It's wired up as `make run` (see the Makefile), which writes its output
# under `results/full_run/`. Run it directly instead with:
#
#     uvex-transients run configs/full_run.yaml --out-dir results/full_run/
#
# Full-scale sampling is not cheap: expect this to take substantially longer
# than the quickstart config, since `generate:` below neither shrinks
# `nside`/`time_bins` below the package default nor thins any
# population beyond what its own event rate needs to stay tractable.

# Pinned to the latest uvex-scheduler release so the data products are reproducible. The
# `.github/workflows/sync_scheduler.yml` workflow bumps this line when a new release appears.
schedule:
  name: uvex_v0.6.0

mission: uvex_fast

# One entry per registered `TransientBase` subclass. Each uses its own
# defaults (rate, redshift limit, duration window; see
# `uvex_transients/transients/*.py`) unmodified.
transients:
  kilonova:
    class: Kilonova
  tde:
    class: TidalDisruptionEvent
  lfbot:
    class: LuminousFastBlueOpticalTransient
  iip_sne:
    class: TypeIIPSNe
  iip_excess_sne:
    class: TypeIIPExcessSNe
  iib_sne:
    class: TypeIIbSNe
  ib_sne:
    class: TypeIbSNe
  ic_sne:
    class: TypeIcSNe
  icbl_sne:
    class: TypeIcBLSNe
  slsne:
    class: MagnetarSLSNe
  ia_sne:
    class: TypeIaSNe

# `nside`/`order` are left unset (package default: `healpix.default_nside`/
# `healpix.default_order` in `uvex_transients/config.yaml`). `time_bins` is
# generous enough to resolve the full mission window at that resolution.
# `sampling_factor` is a `{transient key: factor}` mapping (see
# `docs/source/user_guide/cli/overview.rst`) of multipliers on each type's
# physical event rate, and a type left out of it is sampled at its physical
# rate. Every supernova class is kept at 0.05 (one event in twenty), except
# Type IIb at 0.025 (one in forty), which keeps the high-rate populations
# (Type IIb and IIP SNe, with millions of raw events) tractable. The kilonova,
# LFBOT and TDE populations are rare enough to be sampled in full, so they carry
# no thinning noise. The event count is drawn from a Poisson distribution at the
# scaled rate, so each type's events all carry the same weight, which is
# applied automatically once sampled. A rare type keeps few events at a small
# factor, so choose one that leaves enough of them for the cuts that follow.
generate:
  time_bins: 800
  sampling_factor:
    iip_sne: 0.05
    iip_excess_sne: 0.05
    iib_sne: 0.025
    ib_sne: 0.05
    ic_sne: 0.05
    icbl_sne: 0.05
    slsne: 0.05
    ia_sne: 0.05
  seed: 42

# Two `cut` steps, chained, then a `photometry` action and an `event_summary`
# action over whatever survives both. The four files this run writes
# (`final_catalog.ecsv`, `exposure.ecsv`, `photometry.ecsv` and
# `event_summary.ecsv`) are attached to each GitHub release, where
# `uvex_transients.utils.get_results` downloads them for the website's report
# and its examples. Their file names are load-bearing: renaming one means
# updating `uvex_transients.utils.results.RESULT_ASSETS` too.
steps:
  - id: mag_screen
    type: cut
    cut: limiting_magnitude
    input: baseline
    params:
      mag_limit: 25.0

  - id: snr_screen
    type: cut
    cut: snr
    input: mag_screen
    params:
      snr_threshold: 5.0
      exclude_first_visit_detections: true
    checkpoint: final_catalog.ecsv

  - id: phot
    type: action
    action: photometry
    inputs:
      catalog: snr_screen
    params:
      bands: [FUV, NUV]
    # Full-scale event counts make the intermediate cut catalogs large and
    # rarely worth keeping around (see `keep_intermediate:` below), but the
    # photometry table itself is always worth writing, so it opts back in.
    checkpoint: photometry.ecsv

  # One row per surviving event, with the table's meta carrying what
  # `uvex_transients.simulation.rates.estimate_yield` needs to turn any
  # selection of rows into expected events. `snr_threshold` matches
  # `snr_screen` above.
  - id: summary
    type: action
    action: event_summary
    inputs:
      catalog: snr_screen
      exposure: exposure
      photometry: phot
    params:
      snr_threshold: 5.0
      # The default UVEX footprints plus ZTF and Rubin, so the docs' report can quote
      # how much of each type's detected population falls on their sky. Resolving the LSST
      # footprint needs the `rubin` extra.
      footprints: [uvex:lmlz:wide, uvex:lmlz:deep, uvex:mc, ztf:main, lsst:combined]
    checkpoint: event_summary.ecsv

# Suppresses per-step checkpointing by default (every step above whose own
# `checkpoint:` is unset), and the raw generated `baseline.ecsv` along with
# it. Only `snr_screen`, `phot` and `summary`, which opt back in explicitly,
# and the always-written `exposure.ecsv`, are written to `--out-dir`.
keep_intermediate: false

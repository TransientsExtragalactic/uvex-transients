# ============================================================================ #
# uvex_transients CLI quickstart: tidal disruption events                      #
# ============================================================================ #
# A minimal, single-transient-type run-config for the `uvex-transients` CLI,
# mirroring the TDE end-to-end gallery example
# (docs/source/galleries/simulating/plot_tde_end_to_end.py) but driven from the
# command line instead of a Python script. See `configs/full_run.yaml` for a
# full-scale, every-registered-transient-class config (also wired up via `make
# run`).
#
# Run the whole pipeline (sample events -> screen by magnitude -> screen by SNR
# -> synthetic photometry) in one shot:
#
#     uvex-transients run configs/quickstart_tde.yaml --out-dir results/quickstart/
#
# ...or one stage at a time, useful for inspecting/debugging an intermediate
# catalog before moving on:
#
#     uvex-transients generate configs/quickstart_tde.yaml --out results/quickstart/generated.ecsv
#     uvex-transients cut configs/quickstart_tde.yaml --in results/quickstart/generated.ecsv \
#         --out results/quickstart/screened.ecsv
#     uvex-transients photometry configs/quickstart_tde.yaml --in results/quickstart/screened.ecsv \
#         --out results/quickstart/photometry.ecsv
#
# A command only needs the section(s) below it actually uses; see each
# section's own comment for which command(s) read it.

# `schedule:`, `mission:`, and `transients:` are shared "setup"; every command
# needs them to build a SurveySimulator. `schedule:` names one of the schedules
# registered in the package config (`schedules.schedule_urls`; see
# `uvex_transients.surveys.utils.list_schedules` for the full set); it also
# happens to be the package default, so this block is here for clarity, not
# because it's required.
schedule:
  name: uvex_initial_main

# Which m4opt mission (bandpasses, detector, background) to simulate against.
# Defaults to "uvex" if omitted entirely.
mission: uvex

# At least one transient type is required. Each entry needs a `class:` naming a
# registered `TransientBase` subclass; everything else is optional. Uncomment
# the block below to see how you'd override a prior or pin a parameter to a
# fixed value instead of using `VanVelzenTDESED`'s own defaults.
transients:
  tde:
    class: TidalDisruptionEvent
    # z_limit: 2.0
    # parameters:
    #   amplitude: !prior {type: normal, mean: 43.8, sigma: 0.3}
    #   sigma_rise: 1.0 day

# Read by `generate`/`run`. `downsample` trades sample size for speed: a
# high-rate population like TDEs can produce hundreds of thousands of events
# over a full-mission schedule, most of them far too faint to ever matter;
# `downsample: 20` draws a random 1/20th subset instead (rescale counts back up
# by this factor afterward). `nside`/`order` fall back to the package default
# (`healpix.default_nside`/`healpix.default_order`) if omitted.
generate:
  time_bins: 20
  nside: 64
  downsample: 20
  seed: 42

# Read by `cut`/`run`. Two cuts, run in this declared order: first the cheap
# "could this event ever clear a fixed magnitude limit" screen, then the more
# expensive "was it actually detected by the real schedule" screen. `type:`
# must be one of `SurveySimulator.available_cuts()`; everything else under a
# cut is forwarded as keyword arguments to that cut's underlying method.
cuts:
  mag_screen:
    type: limiting_magnitude
    mag_limit: 25.0
  snr_screen:
    type: snr
    snr_threshold: 5.0

# Read by `photometry`/`run`. Optional; omit entirely to evaluate every band
# the mission's detector has, at the package's default detection significance.
photometry:
  bands: [FUV, NUV]

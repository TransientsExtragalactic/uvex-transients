[default]
extend-ignore-identifiers-re = [
]

[default.extend-identifiers]
# scipy's LinearNDInterpolator (N-dimensional), not "LinearANDInterpolator"
LinearNDInterpolator = "LinearNDInterpolator"
# dN/dM, the luminosity function per unit magnitude (the archive's dataset name), not "dAnd M"
dNdM = "dNdM"

[default.extend-words]
# numpy's np.arange, not a misspelling of "arrange"
arange = "arange"
# Don't correct the surname "Teh"
emiss = "emiss"
# RST bold-letter acronym fragments — e.g. **L**\ ibrary renders as "Library"
ibrary = "ibrary"

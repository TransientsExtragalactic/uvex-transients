# ======================================================== #
# uvex_transients Default Configuration File                #
# ======================================================== #
# This file provides default settings for uvex_transients. Users can override
# these defaults using:
# - the UVEX_TRANSIENTS_CONFIG environment variable
# - .uvex_transientsrc in the project directory
# - ~/.config/uvex_transients/config.yaml
#
# Values in this file are safe defaults suitable for most environments.

# ------------------------------- #
# SYSTEM CONFIGURATION            #
# ------------------------------- #
system:

  # LOGGING
  # -------
  logging:
    main:
      level: INFO
      format: '[uvex_transients]-%(levelname)s: %(message)s'

# ------------------------------- #
# PHYSICS CONFIGURATION           #
# ------------------------------- #
# Physics defaults shared throughout uvex_transients. Every function that
# accepts a `cosmology` argument falls back to this value when none is given
# (see uvex_transients.models._cosmology.get_cosmology).
physics:
  default_cosmology: !astropy_cosmology
    name: Planck18

  # Default Milky Way reddening law (see uvex_transients.dust.get_dust_law/
  # log_attenuation), by name -- currently just "g23" (Gordon+2023).
  default_dust_law: g23

  # Milky Way dust map source URLs (see uvex_transients.dust.dust_map), tried in
  # order. Same two mirrors (IRSA, then ESA) and the same astropy download cache
  # that m4opt.synphot.extinction._dust.dust_map uses, so a cache warmed by
  # either package is shared by both.
  dust_map_sources:
    - https://irsa.ipac.caltech.edu/data/Planck/release_2/all-sky-maps/maps/component-maps/foregrounds/COM_CompMap_Dust-GNILC-Model-Opacity_2048_R2.01.fits
    - https://pla.esac.esa.int/pla/aio/product-action?MAP.MAP_ID=COM_CompMap_Dust-GNILC-Model-Opacity_2048_R2.01.fits


# ------------------------------- #
# HEALPIX RESOLUTION              #
# ------------------------------- #
# Shared default HEALPix resolution/ordering for every survey-footprint/coverage
# query (uvex_transients.surveys.base.SurveySchedule) and Monte Carlo sampling
# grid (uvex_transients.simulation.core.SurveySimulator) that accepts
# nside/order, unless the caller passes its own (see
# uvex_transients.utils.resolve_healpix_resolution).
healpix:
  default_nside: 128
  default_order: nested


# ------------------------------- #
# SURVEYS CONFIGURATION           #
# ------------------------------- #
surveys:
  # Fractional inflation applied to a footprint's exact bounding radius (see
  # uvex_transients.surveys.base._bounding_radius), a safety margin against an
  # axis-aligned bounding-circle search missing a rotated footprint's true extent.
  footprint_bounding_margin: 1.01

  # Default LSST/Rubin PairMetric-style cadence-sensitivity convention shared by
  # SurveySchedule.compute_pair_counts/compute_pair_count_curve/
  # compute_control_time/compute_control_time_curve.
  cadence:
    minimum_factor: 0.5
    maximum_factor: 2.0
    visibility_factor: 3.0

  # Network timeout (seconds) for downloading a schedule table
  # (uvex_transients.surveys.utils.download_schedule_from_url); null uses
  # astropy's own default.
  download_timeout:


# ------------------------------- #
# EXTERNAL SCHEDULES              #
# ------------------------------- #
# As development continues with the UVEX scheduler, various schedules are available with
# different levels of fidelity. Here, we provide URLs for a few of the schedules which should be
# made available for users.
schedules:
  schedule_urls:
    # The schedule URLs are all of the schedules which we can provide to users for direct download
    # from the UVEX scheduler repository.
    uvex_initial_main: https://raw.githubusercontent.com/m4opt/uvex-scheduler/refs/heads/main/tables/plan.ecsv
    uvex_initial_082726: https://github.com/m4opt/uvex-scheduler/raw/3d9441ba3f513402b62d8596d68fc17d9b6df5f4/tables/initial-survey.ecsv

  # Set the default schedule.
  default_schedule: uvex_initial_main


# ------------------------------- #
# SIMULATION CONFIGURATION        #
# ------------------------------- #
simulation:
  # Memory/precision tuning knobs for SurveySimulator.filter_by_limiting_magnitude
  # -- see its docstring for the array-memory tradeoff each controls.
  filter_by_limiting_magnitude:
    n_phase: 50
    chunk_size: 5000

  # Memory tuning knob for SurveySimulator.filter_by_snr; see its docstring.
  filter_by_snr:
    chunk_size: 2000

  # Default detection-significance threshold for Event.simulate_photometry.
  detection_n_sigma: 5.0

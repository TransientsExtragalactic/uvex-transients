# ======================================================== #
# uvex_transients Default Configuration File                #
# ======================================================== #
# This file provides default settings for uvex_transients. Users can override
# these defaults using:
# - the UVEX_TRANSIENTS_CONFIG environment variable
# - .uvex_transientsrc in the project directory
# - ~/.config/uvex_transients/config.yaml
#
# Values in this file are safe defaults suitable for most environments.

# ------------------------------- #
# SYSTEM CONFIGURATION            #
# ------------------------------- #
system:

  # LOGGING
  # -------
  logging:
    main:
      level: INFO
      format: '[uvex_transients]-%(levelname)s: %(message)s'
  # CACHING
  # -------
  caching:
    # Cache directory for uvex_transients to store downloaded files, intermediate
    # results, and other persistent data. If null, uvex_transients uses the
    # platform-appropriate default (see uvex_transients.utils.get_cache_dir).
    cache_dir: null

# ------------------------------- #
# PHYSICS CONFIGURATION           #
# ------------------------------- #
# Physics defaults shared throughout uvex_transients. Every function that
# accepts a `cosmology` argument falls back to this value when none is given
# (see uvex_transients.models._cosmology.get_cosmology).
physics:
  default_cosmology: !astropy_cosmology
    name: Planck18

  # Default Milky Way reddening law (see uvex_transients.dust.get_dust_law/
  # log_attenuation), by name -- currently just "g23" (Gordon+2023).
  default_dust_law: g23

  # Milky Way dust map source URLs (see uvex_transients.dust.dust_map), tried in
  # order. Same two mirrors (IRSA, then ESA) and the same astropy download cache
  # that m4opt.synphot.extinction._dust.dust_map uses, so a cache warmed by
  # either package is shared by both.
  dust_map_sources:
    - https://irsa.ipac.caltech.edu/data/Planck/release_2/all-sky-maps/maps/component-maps/foregrounds/COM_CompMap_Dust-GNILC-Model-Opacity_2048_R2.01.fits
    - https://pla.esac.esa.int/pla/aio/product-action?MAP.MAP_ID=COM_CompMap_Dust-GNILC-Model-Opacity_2048_R2.01.fits


# ------------------------------- #
# HEALPIX RESOLUTION              #
# ------------------------------- #
# Shared default HEALPix resolution/ordering for every survey-footprint/coverage
# query (uvex_transients.surveys.base.SurveySchedule) and Monte Carlo sampling
# grid (uvex_transients.simulation.core.SurveySimulator) that accepts
# nside/order, unless the caller passes its own (see
# uvex_transients.utils.resolve_healpix_resolution).
healpix:
  default_nside: 128
  default_order: nested


# ------------------------------- #
# SURVEYS CONFIGURATION           #
# ------------------------------- #
surveys:
  # Fractional inflation applied to a footprint's exact bounding radius (see
  # uvex_transients.surveys.base._bounding_radius), a safety margin against an
  # axis-aligned bounding-circle search missing a rotated footprint's true extent.
  footprint_bounding_margin: 1.01

  # Default LSST/Rubin PairMetric-style cadence-sensitivity convention shared by
  # SurveySchedule.compute_pair_counts/compute_pair_count_curve/
  # compute_control_time/compute_control_time_curve.
  cadence:
    minimum_factor: 0.5
    maximum_factor: 2.0
    visibility_factor: 3.0

  # Network timeout (seconds) for downloading a schedule table
  # (uvex_transients.surveys.utils.download_schedule_from_url); null uses
  # astropy's own default.
  download_timeout:


# ------------------------------- #
# EXTERNAL SCHEDULES              #
# ------------------------------- #
# As development continues with the UVEX scheduler, various schedules are available with
# different levels of fidelity. Here, we provide URLs for a few of the schedules which should be
# made available for users.
schedules:
  schedule_urls:
    # The schedule URLs are all of the schedules which we can provide to users for direct download
    # from the UVEX scheduler repository.
    uvex_dev: https://raw.githubusercontent.com/m4opt/uvex-scheduler/refs/heads/main/tables/plan.ecsv
    uvex_v0.5.0: https://raw.githubusercontent.com/m4opt/uvex-scheduler/refs/tags/v0.5.0/tables/plan.ecsv
    uvex_v0.4.0: https://raw.githubusercontent.com/m4opt/uvex-scheduler/refs/tags/v0.4.0/tables/plan.ecsv
    uvex_v0.3.0: https://raw.githubusercontent.com/m4opt/uvex-scheduler/refs/tags/v0.3.0/tables/plan.ecsv
    uvex_initial_082726: https://github.com/m4opt/uvex-scheduler/raw/3d9441ba3f513402b62d8596d68fc17d9b6df5f4/tables/initial-survey.ecsv

  # Set the default schedule.
  default_schedule: uvex_dev


# ------------------------------- #
# OBSERVATORY FOOTPRINTS          #
# ------------------------------- #
# URLs and parameters for the generators in uvex_transients.surveys.footprints, kept here
# so a new mirror or footprint file is a config change, not a code change.
observatories:
  uvex:
    # Base URL for the uvex-scheduler repo's survey-footprint region files. It tracks
    # main, so an upstream fix is picked up automatically; to refresh an already cached
    # MOC, clear it with SurveyFootprint.clear_from_cache.
    repo_url: https://raw.githubusercontent.com/m4opt/uvex-scheduler/main
    # Radius (degrees) that expands a DS9 point() target into a circle: UVEX's inscribed
    # FOV circle (fov/inscribed-circle.ds9 in uvex-scheduler).
    point_region_size: 1.83081195
    footprints:
      lmlz_wide:
        name: uvex:lmlz:wide
        file: survey-footprints/lmlz-wide.ds9
        description: UVEX low-Milky-Way/low-zodi wide survey (NGC A-D, SGC A-B).
      lmlz_deep:
        name: uvex:lmlz:deep
        file: survey-footprints/lmlz-deep.ds9
        description: UVEX LMLZ deep fields (point targets expanded to the inscribed FOV circle).
      magellanic_clouds:
        name: uvex:mc
        file: survey-footprints/magellanic-clouds.ds9
        description: UVEX Magellanic Clouds survey (LMC + SMC).

  ztf:
    # ZTF has no published footprint file; its coverage is a declination cut
    # (visibility from Palomar), see uvex_transients.surveys.footprints.utils.dec_band_MOC.
    min_dec: -31.0

  ls4:
    # LS4 has no published footprint file. Only the SOLE survey is defined, from the two
    # Galactic l/b boxes in Section 3.1.3 of Bellm et al. 2025 (arXiv:2503.14579); their union
    # is ~1200 deg^2, matching the paper. See uvex_transients.surveys.footprints.ls4 for why
    # LS4's other surveys are omitted.
    sole:
      name: ls4:sole
      description: LS4 Stellar Oscillations, Lensing, and Eruptions survey (Galactic plane + bulge).
      boxes:
        - {l_min: -72, l_max: 36, b_min: -4, b_max: 4}    # Galactic plane strip
        - {l_min: -20, l_max: 20, b_min: -8, b_max: 8}    # Galactic bulge

  lsst:
    # Built by uvex_transients.surveys.footprints.lsst from rubin_scheduler's sky-area map
    # (optional dependency). `labels` are that map's region labels; an empty list selects every
    # observed pixel. Bump `version` to invalidate cached MOCs after a rubin_scheduler upgrade
    # changes the survey strategy.
    version: v1
    nside: 128
    regions:
      main:
        name: lsst:main
        labels: []
        description: Rubin LSST main survey, every region of the scheduler sky-area map.
      wfd:
        name: lsst:wfd
        labels: [lowdust]
        description: Rubin LSST wide-fast-deep (low-dust extragalactic) area.
      nes:
        name: lsst:nes
        labels: [nes]
        description: Rubin LSST north ecliptic spur.
      scp:
        name: lsst:scp
        labels: [scp]
        description: Rubin LSST south celestial pole.
      galactic_plane:
        name: lsst:galplane
        labels: [dusty_plane, bulge]
        description: Rubin LSST Galactic plane and bulge.
      magellanic_clouds:
        name: lsst:mc
        labels: [LMC_SMC]
        description: Rubin LSST Magellanic Clouds.
      virgo:
        name: lsst:virgo
        labels: [virgo]
        description: Rubin LSST Virgo cluster.
    ddf:
      name: lsst:ddf
      radius: 1.75   # degrees; half of Rubin's ~3.5 deg field of view
      description: Rubin LSST deep drilling fields (single pointings expanded to the FOV circle).
    combined:
      name: lsst:combined
      description: Rubin LSST everything observed, the main survey plus the deep drilling fields.


# ------------------------------- #
# PLOTTING CONFIGURATION          #
# ------------------------------- #
# Default settings for uvex_transients.utils.plotting, used by every plotting function in the
# package and docs gallery unless the caller overrides them explicitly (see
# uvex_transients.utils.plotting.resolve_fig_axes/set_plot_style/get_default_cmap/get_band_color).
plotting:
  default_figsize: [10, 6]  # Default figure size (inches) for a newly created figure.
  dpi: 100                  # Default figure resolution.
  default_cmap: viridis     # Default colormap for anything without its own per-series color.
  use_tex: false            # Whether to render plot text with LaTeX. False so plotting works out of
                            # the box; enable if LaTeX is installed.
  latex_preamble: '\usepackage{amsmath,amssymb}'

  # Categorical colors for unordered groups (e.g. survey footprints), assigned in this fixed
  # order and never cycled (see uvex_transients.utils.plotting.get_categorical_colors). The
  # first three stay distinguishable in any pairing, including under color-vision deficiency;
  # beyond that, pair the colors with a legend or labels.
  categorical_colors: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

  # Shared per-band colors, so a given photometric band reads as the same color everywhere it's
  # plotted across the docs gallery and reports (see
  # uvex_transients.utils.plotting.get_band_color). UVEX's own FUV/NUV plus Rubin/LSST's ugrizy,
  # both drawn from the same fixed, colorblind-legible palette used throughout the gallery.
  band_colors:
    FUV: "#4C72B0"
    NUV: "#DD8452"
    u: "#56B4E9"
    g: "#008060"
    r: "#FF4000"
    i: "#850000"
    z: "#6600CC"
    y: "#000000"

  # Default bar color for uvex_transients.utils.plotting.plot_detection_funnel when the caller
  # doesn't specify one.
  funnel_color: "#4C72B0"


# ------------------------------- #
# MISSION CONFIGURATION           #
# ------------------------------- #
missions:
  # Bandpass downsampling (see uvex_transients.missions). Dense m4opt bandpass tables make every
  # band-integrated quantity slow and memory hungry; a downsampled copy matches blackbody band
  # integrals between t_min and t_max to within tol_mag. The registered "uvex_fast" mission is
  # always downsampled with these settings.
  downsample:
    # Downsample every mission resolved by name (e.g. "uvex"), not only the registered fast ones.
    enabled: false
    # Largest tolerated band magnitude error over the verification temperatures.
    tol_mag: 1.0e-3
    # Temperature range (K) the downsampled bandpass must be accurate for. A cooler t_min or a
    # smaller tol_mag keeps more points.
    t_min: 1500.0
    t_max: 50000.0
    # Number of log-uniform blackbodies the downsampling is optimized on.
    n_spec: 12


# ------------------------------- #
# SIMULATION CONFIGURATION        #
# ------------------------------- #
simulation:
  # Memory/precision tuning knobs for SurveySimulator.filter_by_limiting_magnitude
  # -- see its docstring for the array-memory tradeoff each controls.
  filter_by_limiting_magnitude:
    n_phase: 50
    chunk_size: 5000

  # Memory tuning knob for SurveySimulator.filter_by_snr; see its docstring.
  filter_by_snr:
    chunk_size: 2000

  # Default detection-significance threshold for Event.simulate_photometry.
  detection_n_sigma: 5.0

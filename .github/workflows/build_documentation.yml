# .github/workflows/build_documentation.yml
# ------------------------------------------------------------- #
# GitHub Actions Workflow to Build and Deploy Versioned Docs     #
# ------------------------------------------------------------- #
# Deploys versioned docs to `/vX.Y.Z` via the shared `_docs_build_deploy.yml`
# pipeline, updates `versions.json`, and refreshes the root `/` redirect to
# point at the newest tag.
#
# Deliberately *not* triggered directly by the `vX.Y.Z` tag push: a GitHub
# Release for that tag (and this run's `report/` page needs its
# `yield_summary.ecsv`/`detection_counts.ecsv` assets) doesn't exist until
# `build_and_release.yml`'s `release_data_products` job finishes its
# full-population run and uploads them -- often well after the tag is
# pushed. That job dispatches this workflow itself (`gh workflow run
# build_documentation.yml --ref <tag>`) once those assets are actually
# there, so this only ever builds against a complete release.
#
# `workflow_dispatch` doubles as the manual escape hatch: rebuild on demand
# without cutting a release (e.g. a docs-only fix for the latest tag), or
# retry if the automatic dispatch above ever fails.
name: Build and Deploy Documentation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    uses: ./.github/workflows/_docs_build_deploy.yml
    with:
      destination_dir: ${{ github.ref_name }}
    secrets: inherit

# .github/workflows/check_pull_requests.yml
# ------------------------------------------------ #
# GitHub Actions Workflow for Pull Request Checks  #
# ------------------------------------------------ #
# This workflow runs checks on every pull request to ensure code quality and
# consistency:
#
# 1. Pre-commit run on the codebase.
# 2. Run the test suite.
name: Pull Request Checks

on:
  pull_request:

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pre-commit
          pip install .[dev]
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # Ensure that the test suite passes.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[dev,test]"
      - name: Run tests
        run: pytest --tb=short --disable-warnings

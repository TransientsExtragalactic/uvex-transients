# .github/workflows/_docs_build_deploy.yml
# ------------------------------------------------------------- #
# Reusable workflow: build + deploy one docs tree                #
# ------------------------------------------------------------- #
# The actual Sphinx build/deploy/versions.json-update pipeline, shared by
# `docs_dev.yml` (pushes to `dev` -> `/dev/`) and `build_documentation.yml`
# (a versioned release -> `/vX.Y.Z/`) so the two never drift apart. Not
# triggered directly -- only via `workflow_call` from those two.
name: (Reusable) Build and Deploy Documentation

on:
  workflow_call:
    inputs:
      destination_dir:
        description: Directory under the gh-pages root to publish this build to (e.g. "dev" or "v1.2.0").
        required: true
        type: string
      version_match:
        description: >-
          Value for the pydata-sphinx-theme version switcher to match against `versions.json`.
          Defaults to `destination_dir`.
        required: false
        type: string

permissions:
  contents: write

jobs:
  docs:
    name: Build and Deploy Documentation (${{ inputs.destination_dir }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required for setuptools-scm tag-based versioning

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Cache pip dependencies to speed up builds. This
      # depends on the os and the hash of the pyproject.toml file.
      # It will therefore be invalidated when the dependencies change.
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      # Cache Sphinx's own incremental-build state (the doctree pickle cache,
      # kept out of the published `docs/_build/html` tree via `-d` below) plus
      # autosummary's generated stubs and sphinx-gallery's executed-example
      # outputs -- both idempotent given unchanged source, and both
      # expensive to regenerate from scratch. Keyed on doc source + package
      # source content, so an exact-key miss still falls back (`restore-keys`)
      # to the nearest prior cache and lets Sphinx/sphinx-gallery's own
      # per-file hash checks do the real incremental work from there.
      - name: Cache Sphinx build state
        uses: actions/cache@v6
        with:
          path: |
            docs/_build/doctrees
            docs/source/_as_gen
            docs/source/auto_examples
          key: ${{ runner.os }}-sphinx-${{ hashFiles('docs/source/**', 'uvex_transients/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sphinx-

      # Install the dependencies required to build the documentation.
      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[docs]

      # Actually build the documentation. We use the `-j auto` flag to
      # allow Sphinx to use all available CPU cores for faster builds, and an
      # explicit `-d` so the doctree cache above lands outside the published
      # HTML tree.
      - name: Build documentation with Sphinx
        env:
          SPHINX_VERSION_MATCH: ${{ inputs.version_match || inputs.destination_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/_build/html
          sphinx-build -b html -j auto -d docs/_build/doctrees docs/source docs/_build/html

      # ---------------------------------------------------------
      # 1️⃣ Deploy this build (dev or vX.Y.Z)
      # ---------------------------------------------------------
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/_build/html
          destination_dir: ${{ inputs.destination_dir }}
      # ---------------------------------------------------------
      # 2️⃣ Update versions.json + root redirect
      # ---------------------------------------------------------
      # Derived from gh-pages' own directory listing (not from what this run
      # itself just deployed), so it stays correct regardless of which of the
      # two callers ran, or ran last.
      - name: Update versions.json and root redirect
        run: |
          set -e

          BASE_URL="https://transientsextragalactic.github.io/uvex-transients"

          echo "Cloning gh-pages branch..."
          git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
          cd gh-pages
          git pull origin gh-pages

          echo "Generating versions.json..."

          python - << PY
          import json
          import re
          from pathlib import Path

          BASE_URL = "${BASE_URL}"
          root = Path(".")

          versions = []

          # "dev" always sorts first when present -- it's the unreleased tip, not a version.
          if (root / "dev").is_dir():
              versions.append({"name": "dev", "version": "dev", "url": f"{BASE_URL}/dev/"})

          tag_dirs = []
          for p in root.iterdir():
              if p.is_dir() and re.match(r"^v\d+\.\d+\.\d+", p.name):
                  tag_dirs.append(p.name)

          tag_dirs.sort(reverse=True)

          for i, tag in enumerate(tag_dirs):
              entry = {
                  "name": tag,
                  "version": tag,
                  "url": f"{BASE_URL}/{tag}/",
              }
              if i == 0:
                  entry["preferred"] = True
              versions.append(entry)

          (root / "versions.json").write_text(json.dumps(versions, indent=2) + "\n")
          print("Updated versions.json")
          PY

          # Root redirect to the latest released (non-dev) version.
          LATEST=$(ls -d v*/ 2>/dev/null | sed 's:/*$::' | sort -Vr | head -n 1)

          if [ -n "$LATEST" ]; then
            TARGET="$BASE_URL/$LATEST/"

            echo "Creating root redirect to $TARGET"

            cat > index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=$TARGET" />
            </head>
            <body>
              Redirecting to <a href="$TARGET">$TARGET</a>
            </body>
          </html>
          EOF
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add versions.json index.html || true
          git diff --cached --quiet && echo "No changes" || git commit -m "Update versions.json and redirect"
          git push
